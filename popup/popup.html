<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsMD</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="logo-icon">💬</span>
      <span class="logo-text">WhatsMD</span>
    </div>

    <p class="subtitle">Exportar conversa para <code>.md</code></p>

    <div id="banner" class="banner hidden"></div>
    <button id="updateCheckBtn" class="secondary hidden">🔎 Ver se saiu wa-js novo</button>
    <div id="updateResult" class="status hidden"></div>

    <button id="exportBtn">Exportar conversa</button>

    <div class="audio-row">
      <button id="audioBtn" class="secondary">🎙️ Só últimos</button>
      <input type="number" id="audioCount" min="1" step="1" value="10" title="Quantos áudios" />
      <span class="audio-label">áudios</span>
    </div>

    <p class="hint">Exporta as últimas mensagens da conversa aberta, baixando imagens e áudios automaticamente (sem precisar reproduzir). O botão 🎙️ baixa e transcreve só os últimos N áudios, ignorando o resto.</p>

    <div id="progress" class="progress hidden"><div id="progressBar" class="progress-bar"></div></div>
    <div id="status" class="status hidden"></div>

    <button id="configToggle" class="link-btn">⚙️ Transcrição de áudio</button>

    <div id="config" class="config hidden">
      <label class="row">
        <input type="checkbox" id="sttEnabled" />
        <span>Transcrever áudios (voz→texto)</span>
      </label>

      <label class="field">
        <span>Endpoint do Whisper</span>
        <input type="text" id="sttEndpoint" placeholder="http://100.74.40.75:9000" />
      </label>

      <label class="field">
        <span>Idioma (pt, en, es… ou <b>auto</b> p/ detectar)</span>
        <input type="text" id="sttLanguage" placeholder="pt" />
      </label>

      <label class="field">
        <span>Nº de mensagens a exportar</span>
        <input type="number" id="maxMessages" min="1" step="1" placeholder="100" />
      </label>

      <button id="testBtn" class="secondary">Testar conexão</button>
      <div id="testResult" class="status hidden"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
